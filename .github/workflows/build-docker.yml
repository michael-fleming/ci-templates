# Reusable build template: builds the exact commit, pushes to GHCR by digest, and uploads the
# orchestrator build manifest (orchestrator-build-manifest/v1).
name: build-docker

on:
  workflow_call:
    inputs:
      task_id: { required: true, type: string }
      sha: { required: true, type: string }
      dockerfile: { required: false, type: string, default: Dockerfile }
      platforms: { required: false, type: string, default: linux/amd64 }
      hooks: { required: false, type: string, default: "" }
      hooks-dir: { required: false, type: string, default: .orchestrator/hooks }

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Verify the checked-out commit
        run: test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"

      - name: pre-build hook
        if: contains(format(',{0},', inputs.hooks), ',pre-build,')
        run: bash "${{ inputs.hooks-dir }}/pre-build.sh"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}:sha-${{ inputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.sha }}
            dev.orchestrator.task=${{ inputs.task_id }}

      - name: post-build hook
        if: contains(format(',{0},', inputs.hooks), ',post-build,')
        run: bash "${{ inputs.hooks-dir }}/post-build.sh"

      - name: Write build manifest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
          SHA: ${{ inputs.sha }}
        run: |
          jq -n --arg sha "$SHA" --arg image "$IMAGE" --arg digest "$DIGEST" '{
            contract: "orchestrator-build-manifest/v1",
            commitSha: $sha,
            profile: "docker",
            artifacts: [{ kind: "oci-image", name: ($image | split("/") | last), ref: ($image + "@" + $digest), digest: $digest, deployable: true }]
          }' > build-manifest.json
          cat build-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: build-manifest
          path: build-manifest.json
          retention-days: 30
